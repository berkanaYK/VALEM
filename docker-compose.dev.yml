services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vale
      POSTGRES_USER: vale
      POSTGRES_PASSWORD: vale-dev-only
    ports:
      - "5432:5432"
    volumes:
      - vale-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vale -d vale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vale-postgres:

