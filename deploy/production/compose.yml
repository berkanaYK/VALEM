name: valem-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valem}
      POSTGRES_USER: ${POSTGRES_USER:-valem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-8MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=${POSTGRES_SLOW_QUERY_MS:-1000}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-4g}
    mem_reservation: ${POSTGRES_MEMORY_RESERVATION:-2g}
    pids_limit: 512
    shm_size: ${POSTGRES_SHM_SIZE:-512m}
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: valem-api:${VALEM_IMAGE_TAG:-3.5.1}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "10000"
      ReverseProxy__TrustForwardedHeaders: "true"
      ConnectionStrings__ValeDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-valem};Username=${POSTGRES_USER:-valem};Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=${DB_MAX_POOL_SIZE:-100};Timeout=15;Command Timeout=30
      DataProtection__KeysPath: /var/lib/valem/dpkeys
      DataProtection__CertificatePath: /run/valem-secrets/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?DATA_PROTECTION_CERTIFICATE_PASSWORD is required}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-VALE.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-VALE.Client}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      DeviceSessions__LifetimeDays: ${DEVICE_SESSION_LIFETIME_DAYS:-30}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}
      PlatformAdmin__FullName: ${PLATFORM_ADMIN_FULL_NAME:-VALEM Platform Yöneticisi}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Transport: ${EMAIL_TRANSPORT:-Brevo}
      Email__BrevoApiKey: ${EMAIL_BREVO_API_KEY:-}
      Email__BrevoBaseUrl: ${EMAIL_BREVO_BASE_URL:-https://api.brevo.com/v3}
      Email__FromEmail: ${EMAIL_FROM_EMAIL:-}
      Email__FromName: ${EMAIL_FROM_NAME:-VALEM}
      Firebase__Enabled: ${FIREBASE_ENABLED:-false}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Firebase__ServiceAccountJson: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      Billing__GooglePlayEnabled: ${BILLING_GOOGLE_PLAY_ENABLED:-false}
      Billing__PackageName: ${BILLING_PACKAGE_NAME:-com.berkanayk.vale}
      Billing__ProductId: ${BILLING_PRODUCT_ID:-valem_premium_lifetime}
      Billing__FallbackDisplayPrice: ${BILLING_FALLBACK_PRICE:-USD 5.99}
      Billing__DemoVehicleLimit: ${BILLING_DEMO_VEHICLE_LIMIT:-50}
      Billing__ServiceAccountJson: ${BILLING_SERVICE_ACCOUNT_JSON:-}
      Billing__TestPremiumEmails__0: ${BILLING_TEST_PREMIUM_EMAIL_0:-}
    expose:
      - "10000"
    volumes:
      - data-protection-keys:/var/lib/valem/dpkeys
      - ./secrets/dataprotection.pfx:/run/valem-secrets/dataprotection.pfx:ro
    networks:
      - edge
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: ${API_CPU_LIMIT:-1.5}
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    mem_reservation: ${API_MEMORY_RESERVATION:-512m}
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VALEM_DOMAIN: ${VALEM_DOMAIN:?VALEM_DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    mem_limit: ${CADDY_MEMORY_LIMIT:-512m}
    mem_reservation: ${CADDY_MEMORY_RESERVATION:-128m}
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  data-protection-keys:
  caddy-data:
  caddy-config:

networks:
  edge:
  database:
    internal: true
