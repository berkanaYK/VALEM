name: valem-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valem}
      POSTGRES_USER: ${POSTGRES_USER:-valem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    image: valem-api:${VALEM_IMAGE_TAG:-3.4.0}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "10000"
      ReverseProxy__TrustForwardedHeaders: "true"
      ConnectionStrings__ValeDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-valem};Username=${POSTGRES_USER:-valem};Password=${POSTGRES_PASSWORD};SSL Mode=Disable;Pooling=true;Minimum Pool Size=0;Maximum Pool Size=${DB_MAX_POOL_SIZE:-100};Timeout=15;Command Timeout=30
      DataProtection__KeysPath: /var/lib/valem/dpkeys
      DataProtection__CertificatePath: /run/valem-secrets/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERTIFICATE_PASSWORD:?DATA_PROTECTION_CERTIFICATE_PASSWORD is required}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__Issuer: ${JWT_ISSUER:-VALE.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-VALE.Client}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      DeviceSessions__LifetimeDays: ${DEVICE_SESSION_LIFETIME_DAYS:-30}
      PlatformAdmin__Email: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}
      PlatformAdmin__Password: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}
      PlatformAdmin__FullName: ${PLATFORM_ADMIN_FULL_NAME:-VALEM Platform Yöneticisi}
      Email__Enabled: ${EMAIL_ENABLED:-false}
      Email__Transport: ${EMAIL_TRANSPORT:-Brevo}
      Email__BrevoApiKey: ${EMAIL_BREVO_API_KEY:-}
      Email__BrevoBaseUrl: ${EMAIL_BREVO_BASE_URL:-https://api.brevo.com/v3}
      Email__FromEmail: ${EMAIL_FROM_EMAIL:-}
      Email__FromName: ${EMAIL_FROM_NAME:-VALEM}
      Firebase__Enabled: ${FIREBASE_ENABLED:-false}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-}
      Firebase__ServiceAccountJson: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    expose:
      - "10000"
    volumes:
      - data-protection-keys:/var/lib/valem/dpkeys
      - ./secrets/dataprotection.pfx:/run/valem-secrets/dataprotection.pfx:ro
    networks:
      - edge
      - database
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      VALEM_DOMAIN: ${VALEM_DOMAIN:?VALEM_DOMAIN is required}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  data-protection-keys:
  caddy-data:
  caddy-config:

networks:
  edge:
  database:
    internal: true
