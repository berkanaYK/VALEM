services:
  caddy:
    profiles:
      - standalone-edge

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - ./cloudflared.config.yml:/etc/cloudflared/config.yml:ro
    secrets:
      - cloudflare_tunnel_credentials
    networks:
      - edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  cloudflare_tunnel_credentials:
    file: ./secrets/cloudflare-tunnel-credentials.json
