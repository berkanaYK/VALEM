name: VALE API CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'tests/VALE.Api.Tests/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'tests/VALE.Api.Tests/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: vale-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          $hasDotnet10 = dotnet --list-sdks | Select-String '^10\.'
          if (-not $hasDotnet10) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:RUNNER_TEMP\dotnet10"
            "$env:RUNNER_TEMP\dotnet10" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$env:RUNNER_TEMP\dotnet10;$env:PATH"
          }
          dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore tests/VALE.Api.Tests/VALE.Api.Tests.csproj

      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          $audit = dotnet list src/VALE.Api/VALE.Api.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $audit
          if ($audit -match 'has the following vulnerable packages' -or $audit -match 'Critical' -or $audit -match 'High') {
            throw 'API bağımlılık güvenlik denetiminde bilinen zafiyet bulundu.'
          }

      - name: Repository secret exposure scan
        shell: pwsh
        run: |
          $tracked = git ls-files
          if ($tracked -match '(^|/)google-services\.json$' -or $tracked -match 'service[-_]?account.*\.json$') {
            throw 'Credential/config dosyası repoya commit edilmiş.'
          }
          $privateKeyPattern = ('BEGIN ' + 'PRIVATE KEY')
          $googleApiPattern = ('AI' + 'za[0-9A-Za-z_-]{30,}')
          $matches = git grep -n -I -E -- "$privateKeyPattern|$googleApiPattern" -- . 2>$null
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0 -and $matches) {
            Write-Host $matches
            throw 'Repository içinde private key veya Google API key benzeri secret bulundu.'
          }
          if ($grepExit -gt 1) { throw "Secret scan git grep hatası: $grepExit" }
          $global:LASTEXITCODE = 0
          Write-Host 'Secret exposure scan passed.'

      - name: Build API release
        shell: pwsh
        run: dotnet build src/VALE.Api/VALE.Api.csproj -c Release --no-restore -warnaserror

      - name: Run API tests
        shell: pwsh
        run: dotnet test tests/VALE.Api.Tests/VALE.Api.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

      - name: Verify EF Core migration model and script
        shell: pwsh
        run: |
          dotnet tool install --tool-path .tools dotnet-ef --version 10.0.4
          & .\.tools\dotnet-ef migrations has-pending-model-changes --project src/VALE.Api/VALE.Api.csproj --startup-project src/VALE.Api/VALE.Api.csproj --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { throw 'EF Core modelinde migration olarak kaydedilmemiş değişiklik var.' }
          & .\.tools\dotnet-ef migrations script --idempotent --project src/VALE.Api/VALE.Api.csproj --startup-project src/VALE.Api/VALE.Api.csproj --configuration Release --no-build --output "$env:RUNNER_TEMP\vale-migrations.sql"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$env:RUNNER_TEMP\vale-migrations.sql")) { throw 'Idempotent production migration betiği üretilemedi.' }

      - name: Verify security policies
        shell: pwsh
        run: |
          $program = Get-Content 'src/VALE.Api/Program.cs' -Raw
          @('ManageUsersPolicy','FinancePolicy','ReportsPolicy','AuditPolicy','RecordsEditPolicy','DeleteRecordsPolicy','security_stamp','X-Content-Type-Options','X-Frame-Options','Referrer-Policy','Cache-Control') | ForEach-Object {
            if ($program -notmatch [regex]::Escape($_)) { throw "Eksik güvenlik kontrolü: $_" }
          }
          if ($program -notmatch 'MaxFailedAccessAttempts = 5' -or $program -notmatch 'DefaultLockoutTimeSpan') { throw 'Hesap lockout koruması eksik.' }
          if ($program -notmatch 'AddPolicy\("login"' -or $program -notmatch 'AddPolicy\("2fa"' -or $program -notmatch 'AddPolicy\("password-reset"') { throw 'Auth rate limiting policy eksik.' }
          $tickets = Get-Content 'src/VALE.Api/Controllers/TicketsController.cs' -Raw
          if ($tickets -notmatch 'DeleteRecordsPolicy') { throw 'Silme endpointi policy ile korunmuyor.' }
          if ($tickets -notmatch 'RecordsEditPolicy') { throw 'Düzeltme endpointi policy ile korunmuyor.' }
          $auth = Get-Content 'src/VALE.Api/Controllers/AuthController.cs' -Raw
          if ($auth -notmatch '2fa/setup' -or $auth -notmatch '2fa/enable' -or $auth -notmatch 'login/2fa' -or $auth -notmatch 'email-code/verify') { throw 'Kimlik doğrulama güvenlik endpointleri eksik.' }
          if ($auth -notmatch 'VerifyTwoFactorTokenAsync' -or $auth -notmatch 'ResetAuthenticatorKeyAsync') { throw 'TOTP doğrulama/anahtar yaşam döngüsü eksik.' }
          $admin = Get-Content 'src/VALE.Api/Controllers/AdminController.cs' -Raw
          if ($admin -notmatch 'UpdateSecurityStampAsync') { throw 'Yetki değişikliklerinde aktif oturum iptali eksik.' }
          $migrator = Get-Content 'src/VALE.Api/Data/DatabaseMigrator.cs' -Raw
          if ($migrator -notmatch 'MigrateAsync' -or $migrator -notmatch 'pg_advisory_lock' -or $program -notmatch 'DatabaseSeeder.InitializeAsync') { throw 'Sürümlü ve kilitli EF Core migration başlangıcı eksik.' }
          $productionData = Get-ChildItem 'src/VALE.Api' -Filter '*.cs' -Recurse | Where-Object { $_.FullName -notmatch '[\\/]Migrations[\\/]' } | ForEach-Object { Get-Content $_.FullName -Raw } | Out-String
          if ($productionData -match 'EnsureCreatedAsync?\(' -or $productionData -match 'ALTER\s+TABLE') { throw 'Production kodunda EnsureCreated veya elle ALTER TABLE şema yönetimi bulundu.' }
          $firebase = Get-Content 'src/VALE.Api/Services/FirebasePushSender.cs' -Raw
          if ($firebase -match 'GoogleCredential\.FromJson' -or $firebase -notmatch 'CredentialFactory' -or $firebase -notmatch '\.Fid') { throw 'Güvenli Google credential/FID geçişi eksik.' }
          $platformBase = Get-Content 'src/VALE.Api/Areas/PlatformAdmin/Controllers/PlatformAdminControllerBase.cs' -Raw
          $platformSecurity = Get-Content 'src/VALE.Api/Services/PlatformAdminSecurity.cs' -Raw
          if ($platformBase -notmatch 'AutoValidateAntiforgeryToken' -or
              $platformBase -notmatch 'Roles\.PlatformAdmin' -or
              $platformSecurity -notmatch 'VALEM\.PlatformAdmin' -or
              $program -notmatch 'AddCookie\(PlatformAdminSecurity\.CookieScheme') {
            throw 'Platform yönetim paneli CSRF/rol/ayrı cookie koruması eksik.'
          }
          Write-Host 'VALE API 3.2 security, migration, remembered-session and platform-admin checks passed.'
