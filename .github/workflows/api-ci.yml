name: Build and Test VALE API

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'tests/**'
      - 'Dockerfile'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  api-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vale
          POSTGRES_PASSWORD: vale_test_password
          POSTGRES_DB: vale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vale -d vale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API and tests
        run: dotnet restore tests/VALE.Api.Tests/VALE.Api.Tests.csproj -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Build API and tests
        run: dotnet build tests/VALE.Api.Tests/VALE.Api.Tests.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/VALE.Api.Tests/VALE.Api.Tests.csproj -c Release --no-build

      - name: Dependency vulnerability scan
        shell: bash
        run: |
          dotnet list src/VALE.Api/VALE.Api.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Vulnerable NuGet package detected."
            exit 1
          fi

      - name: API smoke security vehicle and reporting checks
        shell: bash
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__ValeDatabase: Host=127.0.0.1;Port=5432;Database=vale;Username=vale;Password=vale_test_password
          Jwt__Key: ci-only-security-key-please-change-1234567890
          Jwt__Issuer: VALE.Api
          Jwt__Audience: VALE.Client
          Seed__AdminEmail: admin@vale.test
          Seed__AdminPassword: StrongTest!123
          Seed__AdminFullName: CI Admin
          Email__Enabled: "false"
        run: |
          set -euo pipefail
          dotnet run --project src/VALE.Api/VALE.Api.csproj -c Release --no-build --no-launch-profile > api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true; cat api.log' EXIT
          ready=0
          for i in {1..45}; do
            if curl -fsS --max-time 3 http://127.0.0.1:5080/health/ready > ready.json; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:5080/api/status | grep 'VALE.Api'
          headers=$(curl -sSI http://127.0.0.1:5080/health)
          echo "$headers" | grep -qi 'x-content-type-options: nosniff'
          echo "$headers" | grep -qi 'x-frame-options: DENY'

          unauth_status=$(curl -sS -o unauth.json -w '%{http_code}' http://127.0.0.1:5080/api/dashboard)
          test "$unauth_status" = "401"

          login=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"admin@vale.test","password":"StrongTest!123"}' http://127.0.0.1:5080/api/auth/login)
          token=$(echo "$login" | jq -r '.accessToken')
          test -n "$token" && test "$token" != "null"
          auth=(-H "Authorization: Bearer $token")
          curl -fsS "${auth[@]}" http://127.0.0.1:5080/api/dashboard > /dev/null

          tiny_png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZlM8AAAAASUVORK5CYII='
          create_payload=$(jq -nc --arg photo "$tiny_png" '{branchId:null,licensePlate:"07 TEST 210",brand:"Toyota",model:"Corolla",color:"Beyaz",customerName:"CI Müşteri",customerPhone:"05550000001",keyTag:"K-21",parkingSpot:"A-01",notes:"CI fotoğraflı araç",hourlyRate:150,year:2024,fuelType:"Hibrit",transmission:"Otomatik",photoBase64:$photo}')
          ticket=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d "$create_payload" http://127.0.0.1:5080/api/tickets)
          ticket_id=$(echo "$ticket" | jq -r '.id')
          test -n "$ticket_id" && test "$ticket_id" != "null"
          echo "$ticket" | jq -e '.year == 2024 and .fuelType == "Hibrit" and .transmission == "Otomatik" and .hasPhoto == true' > /dev/null

          detail=$(curl -fsS "${auth[@]}" http://127.0.0.1:5080/api/tickets/$ticket_id)
          echo "$detail" | jq -e '.ticket.licensePlate == "07 TEST 210" and .ticket.year == 2024 and (.photoBase64 | length) > 20' > /dev/null

          checkout=$(curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d '{"paymentMethod":"Card"}' http://127.0.0.1:5080/api/tickets/$ticket_id/checkout)
          echo "$checkout" | jq -e '.ticket.status == "Delivered" and .paidAmount > 0' > /dev/null

          report=$(curl -fsS "${auth[@]}" http://127.0.0.1:5080/api/reports/summary)
          echo "$report" | jq -e '.deliveredVehicles >= 1 and .revenue > 0 and (.hourly | length) == 24 and (.daily | length) >= 7 and (.topBrands | any(.brand == "Toyota" and .vehicles >= 1))' > /dev/null

          reg_status=$(curl -sS -o register.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"fullName":"Pending User","email":"pending@vale.test","password":"StrongTest!456"}' http://127.0.0.1:5080/api/auth/register)
          test "$reg_status" = "201"
          pending_login=$(curl -sS -o pending-login.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"pending@vale.test","password":"StrongTest!456"}' http://127.0.0.1:5080/api/auth/login)
          test "$pending_login" = "401"
          forgot_status=$(curl -sS -o forgot.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"admin@vale.test"}' http://127.0.0.1:5080/api/auth/forgot-password)
          test "$forgot_status" = "503"

      - name: Build Docker image
        run: docker build -t vale-api:ci .
