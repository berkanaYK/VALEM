name: VALE API CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'tests/VALE.Api.Tests/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'tests/VALE.Api.Tests/**'
      - '.github/workflows/api-ci.yml'

concurrency:
  group: vale-api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          $hasDotnet10 = dotnet --list-sdks | Select-String '^10\.'
          if (-not $hasDotnet10) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:RUNNER_TEMP\dotnet10"
            "$env:RUNNER_TEMP\dotnet10" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$env:RUNNER_TEMP\dotnet10;$env:PATH"
          }
          dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore tests/VALE.Api.Tests/VALE.Api.Tests.csproj

      - name: Build API release
        shell: pwsh
        run: dotnet build src/VALE.Api/VALE.Api.csproj -c Release --no-restore

      - name: Run API tests
        shell: pwsh
        run: dotnet test tests/VALE.Api.Tests/VALE.Api.Tests.csproj -c Release --no-restore --no-build --logger "console;verbosity=normal"

      - name: Verify security policies
        shell: pwsh
        run: |
          $program = Get-Content 'src/VALE.Api/Program.cs' -Raw
          @('ManageUsersPolicy','FinancePolicy','ReportsPolicy','AuditPolicy','RecordsEditPolicy','DeleteRecordsPolicy') | ForEach-Object {
            if ($program -notmatch [regex]::Escape($_)) { throw "Eksik güvenlik policy: $_" }
          }
          $tickets = Get-Content 'src/VALE.Api/Controllers/TicketsController.cs' -Raw
          if ($tickets -notmatch 'DeleteRecordsPolicy') { throw 'Silme endpointi policy ile korunmuyor.' }
          if ($tickets -notmatch 'RecordsEditPolicy') { throw 'Düzeltme endpointi policy ile korunmuyor.' }
          $auth = Get-Content 'src/VALE.Api/Controllers/AuthController.cs' -Raw
          if ($auth -notmatch '2fa/setup' -or $auth -notmatch '2fa/enable') { throw '2FA endpointleri eksik.' }
          Write-Host 'VALE API security policy source checks passed.'
