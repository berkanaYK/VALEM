name: Build and Verify WinUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Client/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/winui-ci.yml'
  pull_request:
    paths:
      - 'src/VALE.Client/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/winui-ci.yml'

concurrency:
  group: winui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-launch:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Verify .NET 10 SDK
        shell: pwsh
        run: |
          dotnet --info
          if (-not (dotnet --list-sdks | Select-String '^10\.')) { throw '.NET 10 SDK bulunamadı.' }

      - name: Restore WinUI client
        shell: pwsh
        run: dotnet restore src/VALE.Client/VALE.Client.csproj

      - name: Release build
        shell: pwsh
        run: dotnet build src/VALE.Client/VALE.Client.csproj -c Release --no-restore

      - name: Publish unpackaged WinUI app
        shell: pwsh
        run: >-
          dotnet publish src/VALE.Client/VALE.Client.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o "$env:GITHUB_WORKSPACE\winui-publish"

      - name: Verify real top-level window
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'winui-publish\VALE.Client.exe'
          if (-not (Test-Path $exe)) { throw "WinUI exe bulunamadı: $exe" }
          $process = Start-Process $exe -PassThru
          try {
            $windowReady = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "VALE.Client başlangıç sırasında kapandı. ExitCode=$($process.ExitCode)" }
              if ($process.MainWindowHandle -ne 0) {
                $windowReady = $true
                Write-Host "Top-level WinUI window verified. Handle=$($process.MainWindowHandle), Title='$($process.MainWindowTitle)'"
                break
              }
            }
            if (-not $windowReady) { throw 'Uygulama çalıştı ancak gerçek top-level pencere doğrulanamadı.' }
          }
          finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Package Windows build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\winui-publish\*" -DestinationPath "$env:GITHUB_WORKSPACE\VALE-Windows-x64.zip" -Force
          Get-Item "$env:GITHUB_WORKSPACE\VALE-Windows-x64.zip" | Select-Object FullName,Length

      - name: Publish Windows release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "$env:GITHUB_WORKSPACE\VALE-Windows-x64.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VALE Windows 2.1.0" --notes "VALE Windows 2.1.0. Modern WinUI arayüzü, gelişmiş raporlar, araç kataloğu, fotoğraflı araç kabulü ve doğrulanmış başlatma testi."
