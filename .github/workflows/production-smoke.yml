name: Verify Production VALE API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'render.yaml'
      - 'Dockerfile'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for VDS deployment and verify readiness
        shell: bash
        run: |
          endpoint='https://api.valemyonetim.com'
          ready=0
          for i in {1..60}; do
            echo "Production readiness check $i/60"
            if curl -fsS --max-time 12 "$endpoint/health/ready" > ready.json; then
              status_json=$(curl -fsS --max-time 12 "$endpoint/api/status" || true)
              if printf '%s' "$status_json" | grep -q '"version":"3.7.0"' && \
                 printf '%s' "$status_json" | grep -q '"rememberedDevices":true' && \
                 printf '%s' "$status_json" | grep -q '"platformAdmin":true' && \
                 printf '%s' "$status_json" | grep -q '"migrations":true'; then
                ready=1
                cat ready.json
                break
              fi
              echo 'VDS henüz VALE API 3.7.0 kayıt ve giriş sürümünde değil.'
            fi
            sleep 10
          done
          test "$ready" = "1"
          curl -fsS --max-time 12 "$endpoint/api/status" | tee status.json
          grep -q 'VALE.Api' status.json
          grep -q '"version":"3.7.0"' status.json
          grep -q '"usernameLogin":true' status.json
          grep -q '"multiTenant":true' status.json
          grep -q '"rememberedDevices":true' status.json
          grep -q '"platformAdmin":true' status.json
          grep -q '"migrations":true' status.json

      - name: Verify email, auth boundaries and platform admin surface
        shell: bash
        run: |
          endpoint='https://api.valemyonetim.com'
          curl -fsS --max-time 30 "$endpoint/health/email" | tee email.json
          grep -q '"status":"ready"' email.json
          grep -q '"smtp":true' email.json
          profile_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "$endpoint/api/auth/profile")
          test "$profile_code" = '401'
          admin_login_code=$(curl -sS -o admin-login.html -w '%{http_code}' --max-time 12 "$endpoint/platform-admin/Account/Login")
          test "$admin_login_code" = '200'
          grep -q 'VALEM yönetim paneli' admin-login.html
          admin_dashboard_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "$endpoint/platform-admin")
          case "$admin_dashboard_code" in
            302|307) ;;
            *) echo "Yetkisiz platform admin erişimi yönlendirilmedi: $admin_dashboard_code"; exit 1 ;;
          esac
