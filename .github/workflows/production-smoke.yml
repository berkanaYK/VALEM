name: Verify Production VALE API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/VALE.Api/**'
      - 'src/VALE.Contracts/**'
      - 'render.yaml'
      - 'Dockerfile'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for Render deployment and verify readiness
        shell: bash
        run: |
          endpoint='https://vale-api-5fvb.onrender.com'
          ready=0
          for i in {1..60}; do
            echo "Production readiness check $i/60"
            if curl -fsS --max-time 12 "$endpoint/health/ready" > ready.json; then
              status_json=$(curl -fsS --max-time 12 "$endpoint/api/status" || true)
              if printf '%s' "$status_json" | grep -q '"multiTenant":true'; then
                ready=1
                cat ready.json
                break
              fi
              echo 'Render henüz multi-tenant capability sürümünde değil.'
            fi
            sleep 10
          done
          test "$ready" = "1"
          curl -fsS --max-time 12 "$endpoint/api/status" | tee status.json
          grep -q 'VALE.Api' status.json
          grep -q '"multiTenant":true' status.json

