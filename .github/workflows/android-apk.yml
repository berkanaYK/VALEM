name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore
        shell: pwsh
        run: dotnet restore src/VALE.Mobile/VALE.Mobile.csproj

      - name: Publish APK
        shell: pwsh
        run: >-
          dotnet publish src/VALE.Mobile/VALE.Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormats=apk
          -p:RunAOTCompilation=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VALE-Android-APK
          path: src/VALE.Mobile/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 30
