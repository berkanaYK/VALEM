name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - 'src/VALE.Api/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - 'src/VALE.Api/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Publish pending release status
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state='pending' -f context='vale/android-release' -f description='VALE Android 3.1.0 release doğrulanıyor.' -f target_url=$target

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          $hasDotnet10 = dotnet --list-sdks | Select-String '^10\.'
          if (-not $hasDotnet10) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:RUNNER_TEMP\dotnet10"
            "$env:RUNNER_TEMP\dotnet10" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$env:RUNNER_TEMP\dotnet10;$env:PATH"
          }
          dotnet --info

      - name: Select Java 17
        shell: pwsh
        run: |
          $javaHome = $env:JAVA_HOME_17_X64
          if (-not $javaHome -or -not (Test-Path $javaHome)) {
            $javaHome = Get-ChildItem 'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk' -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '17.*' } | Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $javaHome) { throw 'Java 17 bulunamadı.' }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$javaHome\bin\java.exe" -version

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Verify VALE 3.1 source surface
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/VALE.Mobile/VALE.Mobile.csproj'
          $propertyGroup = @($project.Project.PropertyGroup) | Select-Object -First 1
          if ([string]$propertyGroup.UseNativeHttpHandler -ne 'false') { throw 'Release engellendi: managed HTTP handler kapalı.' }
          $version = [string]$propertyGroup.ApplicationDisplayVersion
          if ($version -ne '3.1.0') { throw "Beklenen mobil sürüm 3.1.0, bulunan: $version" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $required = @(
            'src/VALE.Contracts/TenantContracts.cs',
            'src/VALE.Api/Controllers/RegistrationController.cs',
            'src/VALE.Api/Controllers/NotificationsController.cs',
            'src/VALE.Api/Services/NotificationService.cs',
            'src/VALE.Mobile/TenantRegisterPage.cs',
            'src/VALE.Mobile/V31AppShell.cs',
            'src/VALE.Mobile/V31ManagementPages.cs',
            'src/VALE.Mobile/V31ReportsPage.cs',
            'src/VALE.Mobile/ReportExportService.cs',
            'src/VALE.Mobile/VisualPreferences.cs'
          )
          $required | ForEach-Object { if (-not (Test-Path $_)) { throw "VALE 3.1 dosyası eksik: $_" } }

          $token = Get-Content 'src/VALE.Api/Services/TokenService.cs' -Raw
          $context = Get-Content 'src/VALE.Api/Services/CurrentUserContext.cs' -Raw
          $ticket = Get-Content 'src/VALE.Api/Services/TicketService.cs' -Raw
          $csv = Get-Content 'src/VALE.Mobile/ReportExportService.cs' -Raw
          $shell = Get-Content 'src/VALE.Mobile/V31AppShell.cs' -Raw
          if ($token -notmatch 'company_id') { throw 'JWT company_id kapsamı eksik.' }
          if ($context -notmatch 'CompanyId' -or $context -notmatch 'Firma sınırı') { throw 'Firma izolasyon kontrolü eksik.' }
          if ($ticket -notmatch 'feeCalculator.Calculate\(ticket.EntryAt, DateTimeOffset.UtcNow') { throw 'Canlı park ücreti hesabı eksik.' }
          if ($csv -notmatch 'encoderShouldEmitUTF8Identifier: true') { throw 'UTF-8 BOM CSV düzeltmesi eksik.' }
          if ($shell -notmatch 'FlyoutBehavior.Flyout' -or $shell -notmatch 'OnBackButtonPressed') { throw 'Drawer veya Android geri navigasyonu eksik.' }
          Write-Host "VALE $version kaynak doğrulamaları geçti."

      - name: Verify Android launcher icon configuration
        shell: pwsh
        run: |
          $manifest = Get-Content 'src/VALE.Mobile/Platforms/Android/AndroidManifest.xml' -Raw
          if ($manifest -notmatch 'android:icon="@mipmap/appicon"') { throw 'Launcher icon manifest referansı eksik.' }
          if ($manifest -notmatch 'android:roundIcon="@mipmap/appicon_round"') { throw 'Round launcher icon manifest referansı eksik.' }
          $project = Get-Content 'src/VALE.Mobile/VALE.Mobile.csproj' -Raw
          if ($project -notmatch 'ForegroundFile="Resources\\AppIcon\\appiconfg.svg"') { throw 'Adaptive icon foreground eksik.' }
          if ($project -notmatch 'MonochromeFile="Resources\\AppIcon\\appiconmono.svg"') { throw 'Android themed icon monochrome katmanı eksik.' }

      - name: Restore solution
        shell: pwsh
        run: dotnet restore VALE.sln

      - name: Build API
        shell: pwsh
        run: dotnet build src/VALE.Api/VALE.Api.csproj -c Release --no-restore

      - name: Run API tests
        shell: pwsh
        run: dotnet test tests/VALE.Api.Tests/VALE.Api.Tests.csproj -c Release --no-restore

      - name: Restore Android project
        shell: pwsh
        run: dotnet restore src/VALE.Mobile/VALE.Mobile.csproj

      - name: Build Android release
        shell: pwsh
        run: dotnet build src/VALE.Mobile/VALE.Mobile.csproj -f net10.0-android -c Release --no-restore -p:RunAOTCompilation=false

      - name: Publish Android APK
        shell: pwsh
        run: dotnet publish src/VALE.Mobile/VALE.Mobile.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=apk -p:RunAOTCompilation=false

      - name: Prepare VALE.apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *-Signed.apk -Recurse | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1 }
          if (-not $apk) { throw 'APK bulunamadı.' }
          Copy-Item $apk.FullName "$env:GITHUB_WORKSPACE\VALE.apk" -Force
          Get-Item "$env:GITHUB_WORKSPACE\VALE.apk" | Select-Object FullName,Length

      - name: Verify launcher icon inside APK
        shell: pwsh
        run: |
          $jar = Join-Path $env:JAVA_HOME 'bin\jar.exe'
          if (-not (Test-Path $jar)) { throw 'jar.exe bulunamadı.' }
          $entries = & $jar tf "$env:GITHUB_WORKSPACE\VALE.apk"
          $icons = @($entries | Where-Object { $_ -match '^res/mipmap[^/]*/appicon(_round)?\.' })
          if ($icons.Count -eq 0) { $icons = @($entries | Where-Object { $_ -match '^res/mipmap.*/appicon' }) }
          if ($icons.Count -eq 0) { throw 'APK içinde launcher icon mipmap varlığı bulunamadı.' }

      - name: Wait for VALE API 3.1 production deployment
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $endpoint = 'https://vale-api-5fvb.onrender.com'
          $ready = $false
          for ($i = 1; $i -le 90; $i++) {
            try {
              $health = Invoke-RestMethod "$endpoint/health/ready" -TimeoutSec 12
              $status = Invoke-RestMethod "$endpoint/api/status" -TimeoutSec 12
              if ($health.status -eq 'ready' -and $status.status -eq 'ok' -and [string]$status.version -eq '3.1') {
                $ready = $true
                break
              }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if (-not $ready) { throw 'VALE API 3.1 production ortamına geçmedi; APK release engellendi.' }

      - name: Production v3.1 smoke tests
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $endpoint = 'https://vale-api-5fvb.onrender.com'
          $login = Invoke-WebRequest "$endpoint/api/auth/login" -Method Post -ContentType 'application/json' -Body '{"email":"mobile-smoke-user@vale.invalid","password":"NotARealPassword!123"}' -TimeoutSec 20 -SkipHttpErrorCheck
          if ($login.StatusCode -ne 401) { throw "Login POST testi başarısız: $($login.StatusCode)" }
          $register = Invoke-WebRequest "$endpoint/api/registration/register" -Method Post -ContentType 'application/json' -Body '{"fullName":"X","email":"not-an-email","password":"short"}' -TimeoutSec 20 -SkipHttpErrorCheck
          if ($register.StatusCode -ne 400) { throw "v3.1 registration validation testi başarısız: $($register.StatusCode)" }

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vale-v3.1.0-$env:GITHUB_RUN_NUMBER"
          $notes = @'
          VALE 3.1.0

          - Gerçek çoklu firma (Company → Branch → User) veri izolasyonu
          - Firma sahibi ve mevcut firmaya personel kayıt akışları
          - Şube bazlı personel onayı ve süreli davet kodları
          - Uygulama içi bildirim merkezi ve araç teslim isteği bildirimleri
          - Açık araçlarda anlık park ücreti
          - PDF görüntüle/paylaş, Excel paylaş ve UTF-8 Türkçe CSV
          - İkonlu alt navigasyon + hamburger/drawer menü
          - Android geri tuşu navigasyon düzeltmesi
          - Daha yumuşak kart tasarımı ve kişisel arka plan görseli
          - Mevcut 2FA, audit ve rol tabanlı güvenlik yapısının firma kapsamına alınması
          '@
          gh release create $tag "$env:GITHUB_WORKSPACE\VALE.apk" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VALE Android $env:APP_VERSION" --notes $notes

      - name: Publish Android release status
        if: always() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'VALE Android 3.1.0 test edildi ve yayınlandı.' } else { 'VALE Android 3.1.0 yayını başarısız; run logunu kontrol edin.' }
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context='vale/android-release' -f description=$description -f target_url=$target
