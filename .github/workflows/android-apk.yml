name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - 'src/VALE.Api/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - 'src/VALE.Api/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  statuses: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository without marketplace actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Publish Android release pending status
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state='pending' -f context='vale/android-release' -f description='VALE Android 3.1.2 login + Authenticator release build başladı.' -f target_url=$target

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          $hasDotnet10 = dotnet --list-sdks | Select-String '^10\.'
          if (-not $hasDotnet10) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:RUNNER_TEMP\dotnet10"
            "$env:RUNNER_TEMP\dotnet10" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$env:RUNNER_TEMP\dotnet10;$env:PATH"
          }
          dotnet --info

      - name: Select Java 17
        shell: pwsh
        run: |
          $javaHome = $env:JAVA_HOME_17_X64
          if (-not $javaHome -or -not (Test-Path $javaHome)) {
            $javaHome = Get-ChildItem 'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk' -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '17.*' } | Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $javaHome) { throw 'Java 17 bulunamadı.' }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$javaHome\bin\java.exe" -version

      - name: Inject Firebase Android configuration
        shell: pwsh
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          $relative = 'src/VALE.Mobile/Platforms/Android/google-services.json'
          $target = Join-Path $env:GITHUB_WORKSPACE $relative
          if (-not [string]::IsNullOrWhiteSpace($env:FIREBASE_GOOGLE_SERVICES_JSON_B64)) {
            try {
              $bytes = [Convert]::FromBase64String($env:FIREBASE_GOOGLE_SERVICES_JSON_B64.Trim())
              [IO.File]::WriteAllBytes($target, $bytes)
              $json = Get-Content $target -Raw | ConvertFrom-Json
              $package = @($json.client.client_info.android_client_info.package_name) | Where-Object { $_ -eq 'com.berkanayk.vale' } | Select-Object -First 1
              if (-not $package) { throw 'google-services.json içinde com.berkanayk.vale Android uygulaması bulunamadı.' }
              Write-Host 'Firebase google-services.json güvenli secret üzerinden enjekte edildi.'
            } catch {
              throw "Firebase Android yapılandırması okunamadı: $($_.Exception.Message)"
            }
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            throw 'FIREBASE_GOOGLE_SERVICES_JSON_B64 GitHub Actions secret tanımlı değil; FCM içermeyen production APK yayınlanamaz.'
          } else {
            Write-Warning 'Firebase Android secret bu branch çalıştırmasında yok; kod derlenecek ancak gerçek FCM runtime testi production release aşamasında yapılacak.'
          }

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore
        shell: pwsh
        run: dotnet restore src/VALE.Mobile/VALE.Mobile.csproj

      - name: Dependency vulnerability audit
        shell: pwsh
        run: |
          $audit = dotnet list src/VALE.Mobile/VALE.Mobile.csproj package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $audit
          if ($audit -match 'has the following vulnerable packages' -or $audit -match 'Critical' -or $audit -match 'High') {
            throw 'Mobil bağımlılık güvenlik denetiminde bilinen zafiyet bulundu.'
          }

      - name: Repository secret exposure scan
        shell: pwsh
        run: |
          $tracked = git ls-files
          if ($tracked -match '(^|/)google-services\.json$' -or $tracked -match 'service[-_]?account.*\.json$') {
            throw 'Firebase credential/config dosyası repoya commit edilmiş.'
          }
          $privateKeyPattern = ('BEGIN ' + 'PRIVATE KEY')
          $googleApiPattern = ('AI' + 'za[0-9A-Za-z_-]{30,}')
          $matches = git grep -n -I -E -- "$privateKeyPattern|$googleApiPattern" -- . 2>$null
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0 -and $matches) {
            Write-Host $matches
            throw 'Repository içinde private key veya Google API key benzeri secret bulundu.'
          }
          if ($grepExit -gt 1) { throw "Secret scan git grep hatası: $grepExit" }
          $global:LASTEXITCODE = 0
          Write-Host 'Secret exposure scan passed.'

      - name: Verify Android transport and push configuration
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/VALE.Mobile/VALE.Mobile.csproj'
          $propertyGroup = @($project.Project.PropertyGroup) | Select-Object -First 1
          if ([string]$propertyGroup.UseNativeHttpHandler -ne 'false') { throw 'Release engellendi: managed HTTP handler kapalı.' }
          $version = [string]$propertyGroup.ApplicationDisplayVersion
          if ($version -ne '3.1.2') { throw "Beklenen mobil sürüm 3.1.2, bulunan: $version" }
          $projectRaw = Get-Content 'src/VALE.Mobile/VALE.Mobile.csproj' -Raw
          if ($projectRaw -notmatch 'Xamarin.Firebase.Messaging') { throw 'Firebase Messaging Android paketi eksik.' }
          if ($projectRaw -notmatch 'QRCoder') { throw 'Authenticator QR üretim paketi eksik.' }
          if ($projectRaw -notmatch 'GoogleServicesJson') { throw 'google-services.json build item tanımı eksik.' }
          $manifest = Get-Content 'src/VALE.Mobile/Platforms/Android/AndroidManifest.xml' -Raw
          if ($manifest -notmatch 'POST_NOTIFICATIONS') { throw 'Android POST_NOTIFICATIONS izni eksik.' }
          if (-not (Test-Path 'src/VALE.Mobile/Platforms/Android/ValeFirebaseMessagingService.cs')) { throw 'FirebaseMessagingService eksik.' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Managed HTTP handler + FCM + Authenticator QR kaynakları doğrulandı. VALE $version"

      - name: Verify Android launcher and bottom navigation icons
        shell: pwsh
        run: |
          $manifest = Get-Content 'src/VALE.Mobile/Platforms/Android/AndroidManifest.xml' -Raw
          if ($manifest -notmatch 'android:icon="@mipmap/appicon"') { throw 'Launcher icon manifest referansı eksik.' }
          if ($manifest -notmatch 'android:roundIcon="@mipmap/appicon_round"') { throw 'Round launcher icon manifest referansı eksik.' }
          $project = Get-Content 'src/VALE.Mobile/VALE.Mobile.csproj' -Raw
          if ($project -notmatch 'ForegroundFile="Resources\\AppIcon\\appiconfg.svg"') { throw 'Adaptive icon foreground eksik.' }
          if ($project -notmatch 'MonochromeFile="Resources\\AppIcon\\appiconmono.svg"') { throw 'Android themed icon monochrome katmanı eksik.' }
          if ($project -notmatch 'ForegroundScale="0.72"') { throw 'Adaptive icon foreground ölçeği beklenen değerde değil.' }
          @('src/VALE.Mobile/Resources/AppIcon/appicon.svg','src/VALE.Mobile/Resources/AppIcon/appiconfg.svg','src/VALE.Mobile/Resources/AppIcon/appiconmono.svg','src/VALE.Mobile/Resources/Images/tab_home.svg','src/VALE.Mobile/Resources/Images/tab_car.svg','src/VALE.Mobile/Resources/Images/tab_report.svg','src/VALE.Mobile/Resources/Images/tab_bell.svg','src/VALE.Mobile/Resources/Images/tab_more.svg') | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Icon dosyası eksik: $_" }
          }
          Write-Host 'Launcher + 5 büyük alt navigasyon ikonu doğrulandı.'

      - name: Verify company mobile security surface
        shell: pwsh
        run: |
          $main = Get-Content 'src/VALE.Mobile/MainPage.cs' -Raw
          $authenticator = Get-Content 'src/VALE.Mobile/AuthenticatorPages.cs' -Raw
          $company = Get-Content 'src/VALE.Mobile/CompanyPages.cs' -Raw
          $client = Get-Content 'src/VALE.Mobile/ApiClient.cs' -Raw
          $tenant = Get-Content 'src/VALE.Mobile/TenantRegisterPage.cs' -Raw
          $shell = Get-Content 'src/VALE.Mobile/ValeAppShellV31.cs' -Raw
          $notifications = Get-Content 'src/VALE.Mobile/NotificationsPage.cs' -Raw
          $pushManager = Get-Content 'src/VALE.Mobile/PushTokenManager.cs' -Raw
          if ($main -notmatch 'LoginWithTwoFactorAsync' -or $main -notmatch 'AuthenticatorLoginPage') { throw 'Mobil Authenticator giriş akışı eksik.' }
          if ($main -match 'await _api\.EnsureServerReadyAsync\(progress') { throw 'Login öncesi 75 saniyelik bloklayan health preflight geri gelmiş.' }
          if ($authenticator -notmatch 'AuthenticatorUri' -or $authenticator -notmatch 'QRCodeGenerator' -or $authenticator -notmatch 'LoginWithTwoFactorAsync') { throw 'QR/TOTP Authenticator akışı eksik.' }
          if ($main -notmatch 'EmailCodeLoginPage') { throw 'E-posta koduyla giriş eksik.' }
          if ($main -notmatch 'Permissions.PostNotifications') { throw 'Bildirim izin istemi eksik.' }
          if ($company -notmatch 'CanManageUsers' -or $company -notmatch 'CanAudit') { throw 'Rol tabanlı şirket menüsü eksik.' }
          if ($client -notmatch 'DeleteTicketAsync' -or $client -notmatch 'UpdateTicketDetailsAsync') { throw 'Kayıt yönetimi istemci metotları eksik.' }
          if ($client -notmatch 'RegisterOwnerAsync' -or $client -notmatch 'RegisterStaffAsync') { throw 'Firma/personel kayıt istemcisi eksik.' }
          if ($client -notmatch 'RegisterPushTokenAsync' -or $client -notmatch 'SendPushTestAsync') { throw 'FCM cihaz kayıt/test istemcisi eksik.' }
          if ($tenant -notmatch 'Firma sahibi / yönetici' -or $tenant -notmatch 'Personel / mevcut firmaya katıl') { throw 'Multi-tenant kayıt ekranı eksik.' }
          if ($shell -notmatch 'AuthenticatorSecurityPage' -or $shell -notmatch 'tab_home.svg' -or $shell -notmatch 'tab_more.svg') { throw 'Authenticator menüsü veya yeni alt navigasyon eksik.' }
          if ($notifications -notmatch 'GetPendingRegistrationsAsync' -or $notifications -notmatch 'SendPushTestAsync') { throw 'Personel onay veya push test ekranı eksik.' }
          if ($pushManager -notmatch 'RegisterPushTokenAsync' -or $pushManager -notmatch 'UnregisterPushTokenAsync') { throw 'Push token yaşam döngüsü eksik.' }
          Write-Host 'VALE 3.1.2 login/Authenticator/UI/security source checks passed.'

      - name: Production auth and security smoke tests
        shell: pwsh
        run: |
          $endpoint = 'https://vale-api-5fvb.onrender.com'
          $ready = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $health = Invoke-WebRequest "$endpoint/health/ready" -TimeoutSec 12 -SkipHttpErrorCheck
              if ($health.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw 'Production VALE API hazır hale gelmedi.' }
          $expectedHeaders = @{
            'X-Content-Type-Options' = 'nosniff'
            'X-Frame-Options' = 'DENY'
            'Referrer-Policy' = 'no-referrer'
          }
          foreach ($key in $expectedHeaders.Keys) {
            $actual = [string]$health.Headers[$key]
            if ($actual -notmatch [regex]::Escape($expectedHeaders[$key])) { throw "Eksik/güvensiz security header: $key=$actual" }
          }
          $dashboard = Invoke-WebRequest "$endpoint/api/dashboard" -TimeoutSec 20 -SkipHttpErrorCheck
          if ($dashboard.StatusCode -ne 401) { throw "Yetkisiz dashboard erişimi engellenmedi: $($dashboard.StatusCode)" }
          $login = Invoke-WebRequest "$endpoint/api/auth/login" -Method Post -ContentType 'application/json' -Body '{"email":"mobile-smoke-user@vale.invalid","password":"NotARealPassword!123"}' -TimeoutSec 20 -SkipHttpErrorCheck
          if ($login.StatusCode -ne 401) { throw "Login POST testi başarısız: $($login.StatusCode)" }
          $badTotp = Invoke-WebRequest "$endpoint/api/auth/login/2fa" -Method Post -ContentType 'application/json' -Body '{"email":"mobile-smoke-user@vale.invalid","password":"NotARealPassword!123","code":"123"}' -TimeoutSec 20 -SkipHttpErrorCheck
          if ($badTotp.StatusCode -ne 400) { throw "Geçersiz TOTP formatı reddedilmedi: $($badTotp.StatusCode)" }
          $register = Invoke-WebRequest "$endpoint/api/auth/register" -Method Post -ContentType 'application/json' -Body '{"fullName":"X","email":"not-an-email","password":"short"}' -TimeoutSec 20 -SkipHttpErrorCheck
          if ($register.StatusCode -ne 400) { throw "Register POST testi başarısız: $($register.StatusCode)" }
          Write-Host 'Production auth/security smoke tests passed.'

      - name: Wait for VALE API SMTP and FCM capabilities on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $endpoint = 'https://vale-api-5fvb.onrender.com'
          $newApi = $false
          for ($i = 1; $i -le 75; $i++) {
            try {
              $status = Invoke-RestMethod "$endpoint/api/status" -TimeoutSec 12
              if ($status.status -eq 'ok' -and $status.capabilities.smtp -eq $true -and $status.capabilities.fcm -eq $true) {
                $profile = Invoke-WebRequest "$endpoint/api/auth/profile" -TimeoutSec 12 -SkipHttpErrorCheck
                if ($profile.StatusCode -eq 401) { $newApi = $true; break }
              }
            } catch { }
            Start-Sleep -Seconds 10
          }
          if (-not $newApi) { throw 'VALE API SMTP+FCM production ortamında hazır değil; APK yayınlanmadı.' }

      - name: Production SMTP mail smoke tests
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $endpoint = 'https://vale-api-5fvb.onrender.com'
          $email = 'memeloialimon@gmail.com'
          $loginCode = Invoke-WebRequest "$endpoint/api/auth/email-code/request" -Method Post -ContentType 'application/json' -Body (ConvertTo-Json @{ email = $email } -Compress) -TimeoutSec 30 -SkipHttpErrorCheck
          if ($loginCode.StatusCode -ne 202) { throw "E-posta giriş kodu SMTP testi başarısız: $($loginCode.StatusCode)" }
          $resetCode = Invoke-WebRequest "$endpoint/api/auth/forgot-password" -Method Post -ContentType 'application/json' -Body (ConvertTo-Json @{ email = $email } -Compress) -TimeoutSec 30 -SkipHttpErrorCheck
          if ($resetCode.StatusCode -ne 202) { throw "Şifre sıfırlama SMTP testi başarısız: $($resetCode.StatusCode)" }
          Write-Host 'SMTP endpoint testleri geçti. Hesap aktif/kayıtlıysa iki test e-postası gönderildi.'

      - name: Release build test
        shell: pwsh
        run: dotnet build src/VALE.Mobile/VALE.Mobile.csproj -f net10.0-android -c Release --no-restore -p:RunAOTCompilation=false

      - name: Publish APK
        shell: pwsh
        run: dotnet publish src/VALE.Mobile/VALE.Mobile.csproj -f net10.0-android -c Release --no-restore -p:AndroidPackageFormats=apk -p:RunAOTCompilation=false

      - name: Prepare VALE.apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *-Signed.apk -Recurse | Select-Object -First 1
          if (-not $apk) { $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1 }
          if (-not $apk) { throw 'APK bulunamadı.' }
          Copy-Item $apk.FullName "$env:GITHUB_WORKSPACE\VALE.apk" -Force
          Get-Item "$env:GITHUB_WORKSPACE\VALE.apk" | Select-Object FullName,Length

      - name: Verify launcher icon inside APK
        shell: pwsh
        run: |
          $jar = Join-Path $env:JAVA_HOME 'bin\jar.exe'
          if (-not (Test-Path $jar)) { throw 'jar.exe bulunamadı.' }
          $entries = & $jar tf "$env:GITHUB_WORKSPACE\VALE.apk"
          $icons = @($entries | Where-Object { $_ -match '^res/mipmap[^/]*/appicon(_round)?\.' })
          if ($icons.Count -eq 0) { $icons = @($entries | Where-Object { $_ -match '^res/mipmap.*/appicon' }) }
          if ($icons.Count -eq 0) { throw 'APK içinde launcher icon mipmap varlığı bulunamadı.' }
          Write-Host 'APK launcher icon entries:'
          $icons | Select-Object -First 20 | ForEach-Object { Write-Host " - $_" }

      - name: Verify Firebase resources inside production APK
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $jar = Join-Path $env:JAVA_HOME 'bin\jar.exe'
          $entries = & $jar tf "$env:GITHUB_WORKSPACE\VALE.apk"
          $messagingService = @($entries | Where-Object { $_ -match 'ValeFirebaseMessagingService' })
          if ($messagingService.Count -eq 0) {
            Write-Host 'Firebase service class may be stored in assemblies rather than direct APK class entries; source/build checks already passed.'
          }
          if (-not (Test-Path 'src/VALE.Mobile/Platforms/Android/google-services.json')) { throw 'Production build sırasında google-services.json mevcut değil.' }
          Write-Host 'Production Firebase Android configuration present.'

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "android-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "$env:GITHUB_WORKSPACE\VALE.apk" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VALE Android $env:APP_VERSION" --notes "VALE 3.1.2: girişte bloklayan uzun sunucu hazırlık preflight'ı kaldırıldı ve arka plan warm-up + doğrudan login getirildi; alt navigasyona büyük gerçek ikonlar eklendi; Google/Microsoft Authenticator uyumlu QR TOTP kurulumu ve ayrı OTP giriş ekranı eklendi; SMTP, FCM, dependency vulnerability, secret exposure, auth ve security-header testleri release kapısına eklendi."

      - name: Publish Android release status
        if: always() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $description = if ($state -eq 'success') { 'VALE Android 3.1.2 login+Authenticator+security test edildi ve yayınlandı.' } else { 'VALE Android 3.1.2 yayını engellendi/başarısız; run logunu kontrol edin.' }
          $target = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f state=$state -f context='vale/android-release' -f description=$description -f target_url=$target