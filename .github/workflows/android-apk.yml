name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository without marketplace actions
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $basic" fetch --depth=1 origin $env:GITHUB_SHA
          git checkout --detach FETCH_HEAD

      - name: Ensure .NET 10 SDK
        shell: pwsh
        run: |
          $hasDotnet10 = dotnet --list-sdks | Select-String '^10\.'
          if (-not $hasDotnet10) {
            Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP\dotnet-install.ps1"
            & "$env:RUNNER_TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:RUNNER_TEMP\dotnet10"
            "$env:RUNNER_TEMP\dotnet10" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "$env:RUNNER_TEMP\dotnet10;$env:PATH"
          }
          dotnet --info

      - name: Select Java 17
        shell: pwsh
        run: |
          $javaHome = $env:JAVA_HOME_17_X64
          if (-not $javaHome -or -not (Test-Path $javaHome)) {
            $javaHome = Get-ChildItem 'C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk' -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '17.*' } |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName 'x64' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          if (-not $javaHome) { throw 'Java 17 bulunamadı.' }
          "JAVA_HOME=$javaHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$javaHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$javaHome\bin\java.exe" -version

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore
        shell: pwsh
        run: dotnet restore src/VALE.Mobile/VALE.Mobile.csproj

      - name: Verify Android transport configuration
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/VALE.Mobile/VALE.Mobile.csproj'
          $propertyGroup = @($project.Project.PropertyGroup) | Select-Object -First 1
          $managedHandler = [string]$propertyGroup.UseNativeHttpHandler
          if ($managedHandler -ne 'false') {
            throw "Release engellendi: UseNativeHttpHandler=false değil. Android Java HTTP handler tekrar devreye girebilir."
          }
          $version = [string]$propertyGroup.ApplicationDisplayVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'ApplicationDisplayVersion bulunamadı.' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Managed HTTP handler doğrulandı. VALE $version"

      - name: Production auth POST smoke tests
        shell: pwsh
        run: |
          $endpoint = 'https://vale-api-5fvb.onrender.com'
          $ready = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $health = Invoke-WebRequest "$endpoint/health/ready" -TimeoutSec 12 -SkipHttpErrorCheck
              if ($health.StatusCode -eq 200) { $ready = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $ready) { throw 'Production VALE API hazır hale gelmedi.' }

          $loginBody = '{"email":"mobile-smoke-user@vale.invalid","password":"NotARealPassword!123"}'
          $login = Invoke-WebRequest "$endpoint/api/auth/login" -Method Post -ContentType 'application/json' -Body $loginBody -TimeoutSec 20 -SkipHttpErrorCheck
          if ($login.StatusCode -ne 401) {
            throw "Login POST smoke testi başarısız. Beklenen 401, alınan $($login.StatusCode). Body: $($login.Content)"
          }

          $registerBody = '{"fullName":"X","email":"not-an-email","password":"short"}'
          $register = Invoke-WebRequest "$endpoint/api/auth/register" -Method Post -ContentType 'application/json' -Body $registerBody -TimeoutSec 20 -SkipHttpErrorCheck
          if ($register.StatusCode -ne 400) {
            throw "Register POST smoke testi başarısız. Beklenen 400, alınan $($register.StatusCode). Body: $($register.Content)"
          }

          Write-Host 'Production login/register JSON POST smoke testleri geçti.'

      - name: Release build test
        shell: pwsh
        run: >-
          dotnet build src/VALE.Mobile/VALE.Mobile.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:RunAOTCompilation=false

      - name: Publish APK
        shell: pwsh
        run: >-
          dotnet publish src/VALE.Mobile/VALE.Mobile.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormats=apk
          -p:RunAOTCompilation=false

      - name: Prepare VALE.apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *-Signed.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1
          }
          if (-not $apk) { throw 'APK bulunamadı.' }
          Copy-Item $apk.FullName "$env:GITHUB_WORKSPACE\VALE.apk" -Force
          Get-Item "$env:GITHUB_WORKSPACE\VALE.apk" | Select-Object FullName,Length

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "android-$env:GITHUB_RUN_NUMBER"
          gh release create $tag "$env:GITHUB_WORKSPACE\VALE.apk" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VALE Android $env:APP_VERSION" --notes "VALE $env:APP_VERSION Android APK. Release yalnızca managed Android HTTP transport, production login/register POST smoke testleri ve Release build başarılı olursa oluşturulur."
