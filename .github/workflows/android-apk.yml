name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/VALE.Mobile/**'
      - 'src/VALE.Contracts/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install MAUI Android workload
        shell: pwsh
        run: dotnet workload install maui-android

      - name: Restore
        shell: pwsh
        run: dotnet restore src/VALE.Mobile/VALE.Mobile.csproj

      - name: Publish APK
        shell: pwsh
        run: >-
          dotnet publish src/VALE.Mobile/VALE.Mobile.csproj
          -f net10.0-android
          -c Release
          -p:AndroidPackageFormats=apk
          -p:RunAOTCompilation=false

      - name: Prepare VALE.apk
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *-Signed.apk -Recurse | Select-Object -First 1
          if (-not $apk) {
            $apk = Get-ChildItem -Path src/VALE.Mobile/bin/Release/net10.0-android -Filter *.apk -Recurse | Select-Object -First 1
          }
          if (-not $apk) { throw "APK bulunamadı." }
          Copy-Item $apk.FullName "$env:GITHUB_WORKSPACE\VALE.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VALE-Android-APK
          path: VALE.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "android-$env:GITHUB_RUN_NUMBER"
          gh release create $tag VALE.apk --title "VALE Android $env:GITHUB_RUN_NUMBER" --notes "VALE Android APK otomatik derlemesi."
