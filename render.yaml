services:
  - type: web
    name: vale-api
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: ConnectionStrings__ValeDatabase
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: VALE.Api
      - key: Jwt__Audience
        value: VALE.Client
      - key: Jwt__ExpiryMinutes
        value: "480"
      - key: DeviceSessions__LifetimeDays
        value: "30"
      - key: PlatformAdmin__Email
        sync: false
      - key: PlatformAdmin__Password
        sync: false
      - key: PlatformAdmin__FullName
        value: VALEM Platform Yöneticisi
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false
      - key: Seed__AdminFullName
        value: VALE Yönetici
      - key: Seed__DefaultBranchCode
        value: MERKEZ
      - key: Seed__DefaultBranchName
        value: Merkez
      - key: Seed__DefaultBranchCity
        value: Antalya
      - key: Email__Enabled
        value: "true"
      - key: Email__Transport
        value: Brevo
      - key: Email__BrevoApiKey
        sync: false
      - key: Email__BrevoBaseUrl
        value: https://api.brevo.com/v3
      - key: Email__Host
        sync: false
      - key: Email__Port
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromEmail
        sync: false
      - key: Email__FromName
        value: VALE
      - key: Email__EnableSsl
        value: "true"
      - key: Firebase__Enabled
        value: "true"
      - key: Firebase__ProjectId
        sync: false
      - key: Firebase__ServiceAccountJson
        sync: false
      - key: Billing__GooglePlayEnabled
        value: "false"
      - key: Billing__PackageName
        value: com.berkanayk.vale
      - key: Billing__ProductId
        value: valem_premium_lifetime
      - key: Billing__FallbackDisplayPrice
        value: "$5.99"
      - key: Billing__DemoVehicleLimit
        value: "50"
      - key: Billing__ServiceAccountJson
        sync: false
      - key: Billing__TestPremiumEmails__0
        value: memeloialimon@gmail.com
      - key: ASPNETCORE_FORWARDEDHEADERS_ENABLED
        value: "true"
      - key: ReverseProxy__TrustForwardedHeaders
        value: "true"
